name: Release artifacts
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: x64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: opentui
      - run: go build -o bin/tasks-backend .
      - name: Package
        run: tar -czf "tasks-tui-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" bin/tasks-tui bin/tasks-backend opentui
      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "tasks-tui-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
